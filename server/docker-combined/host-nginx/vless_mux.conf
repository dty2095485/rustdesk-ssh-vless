map "$ssl_preread_server_name:$ssl_preread_alpn_protocols" $rustdesk_backend {
    ~^nas\.example\.com:.*(h2|http/1\.1) 127.0.0.1:4443;
    ~^nas\.example\.com:                  127.0.0.1:8443;
    ~^rd\.example\.com:                   127.0.0.1:10443;
    default                               127.0.0.1:4443;
}

server {
    listen 443;
    proxy_pass $rustdesk_backend;
    ssl_preread on;
    proxy_connect_timeout 5s;
    proxy_timeout 24h;
}
